name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    # One leg per WordPress version the theme claims to support. `floor` is the
    # oldest supported branch, declared once in package.json as
    # wordpress.requiresAtLeast and resolved here to its newest patch; `latest`
    # is whatever wordpress.org currently ships. A block theme leans hard on
    # Full Site Editing APIs, so the version actually serving soli.nl has to be
    # exercised rather than assumed compatible.
    name: e2e (WP ${{ matrix.channel }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        channel: [latest, floor]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve the WordPress version for this leg
        id: wp
        run: |
          set -euo pipefail
          FLOOR_BRANCH=$(node -p "require('./package.json').wordpress.requiresAtLeast")
          LATEST=$(curl -sf https://api.wordpress.org/core/version-check/1.7/ \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).offers[0].current))')

          if [ "${{ matrix.channel }}" = "latest" ]; then
            VERSION="$LATEST"
          else
            # Newest patch on the floor branch, so security fixes are picked up
            # without anyone editing the matrix.
            VERSION=$(curl -sf https://api.wordpress.org/core/stable-check/1.0/ \
              | FLOOR="$FLOOR_BRANCH" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                  const f=process.env.FLOOR;
                  const k=v=>v.split(".").map(Number);
                  const c=Object.keys(JSON.parse(s)).filter(v=>v===f||v.startsWith(f+"."));
                  if(!c.length){console.error("no releases on branch "+f);process.exit(1);}
                  c.sort((a,b)=>{const x=k(a),y=k(b);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)-(y[i]||0);}return 0;});
                  console.log(c[c.length-1]);
                })')
          fi

          test -n "$VERSION"
          # Both legs name an explicit zip, including `latest`. Leaving it empty
          # there is falsy to wp-env - it guards on `if ( process.env.WP_ENV_CORE )`
          # - so the leg would silently fall back to the `core` pin in
          # .wp-env.json and resolve through the WordPress/WordPress git mirror.
          # On 2026-08-12 WordPress shipped 7.0.4 without pushing the tag and
          # every Soli repo's CI died on `couldn't find remote ref 7.0.4`. The
          # zips are published with the release, so they lack that failure mode.
          # WP_ENV_CORE supersedes the .wp-env.json pin (wp-env merges the
          # environment override last, see lib/config/parse-config.js), which is
          # what lets the floor leg run at all - verified locally by installing
          # 6.9.7 against a config pinning 7.0.4.
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "WP_ENV_CORE=https://wordpress.org/wordpress-${VERSION}.zip" >> $GITHUB_ENV
          echo "Leg '${{ matrix.channel }}' targets WordPress ${VERSION}"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build blocks
        run: npm run build:blocks

      - name: Start wp-env
        run: npm run env:start

      - name: Verify wp-env installed the version this leg targets
        run: |
          set -euo pipefail
          # The release workflows stamp 'Requires at least' and 'Tested up to'
          # from these same two numbers, so if wp-env quietly installed something
          # else the theme would advertise compatibility it never demonstrated.
          # Note the run container is tests-cli, not tests.
          RAW=$(npx wp-env run tests-cli wp core version 2>&1 | tr -d '\r')
          ACTUAL=$(printf '%s\n' "$RAW" | grep -oE '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -1 || true)
          WANTED="${{ steps.wp.outputs.version }}"

          if [ -z "$ACTUAL" ]; then
            echo "::error::could not read the WordPress version from wp-env. Raw output:"
            printf '%s\n' "$RAW"
            exit 1
          fi

          echo "wp-env installed WordPress ${ACTUAL}; this leg targets ${WANTED}"
          echo "WP ${ACTUAL} (${{ matrix.channel }})" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ACTUAL" != "$WANTED" ]; then
            echo "::error::wp-env installed ${ACTUAL} but this leg targets ${WANTED}."
            echo "::error::Usual causes: WP_ENV_CORE no longer overrides the core pin in"
            echo "::error::.wp-env.json, or WordPress released mid-run (re-run the job)."
            exit 1
          fi

      - name: Verify the Dutch locale the suite asserts against is installed
        run: |
          set -euo pipefail
          # bin/setup.sh runs as the afterStart lifecycle script and installs
          # nl_NL; several specs assert Dutch strings. A core swap that skipped
          # the setup would fail those specs for a confusing reason.
          LANG_OPT=$(npx wp-env run tests-cli wp option get WPLANG 2>&1 | tr -d '\r' | grep -oE '^nl_NL$' | head -1 || true)
          if [ "$LANG_OPT" != "nl_NL" ]; then
            echo "::error::the tests environment is not on nl_NL - bin/setup.sh did not complete."
            exit 1
          fi
          echo "Tests environment locale: nl_NL"

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.channel }}
          path: playwright-report/
          retention-days: 7

  # Single required status check. The branch ruleset requires the context `test`,
  # and a matrix job reports one context per leg (`e2e (WP latest)`, `e2e (WP
  # floor)`) rather than a bare one - so this job exists to collapse the matrix
  # back into the name the ruleset expects. Renaming the required check instead
  # would need a careful non-atomic ruleset change; this needs none.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: e2e
    if: always()

    steps:
      - name: Require every WordPress version to pass
        run: |
          set -euo pipefail
          RESULT="${{ needs.e2e.result }}"
          if [ "$RESULT" != "success" ]; then
            echo "::error::the e2e matrix did not pass (result: ${RESULT})"
            exit 1
          fi
          echo "All WordPress versions passed."
